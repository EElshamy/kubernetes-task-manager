apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: eslamelshamy/kubernetes-task-manager:3.0.0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - ./node_modules/typeorm/cli.js
            - migration:run
            - -d
            - dist/database/data-source.js
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USERNAME
              value: task_manager_user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              value: task_manager
