apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: task-staging

resources:
  - ../../base/
  - namespace.yaml
  - migration-job.yaml

patches:
  - path: patches/backend-env.yaml
  - path: patches/frontend-env.yaml
  - path: patches/backend-resources.yaml
  - path: patches/frontend-resources.yaml
  - path: patches/postgres-resources.yaml

images:
  - name: eslamelshamy/kubernetes-task-manager
    newName: eslamelshamy/kubernetes-task-manager-backend
    newTag: 3.0.1