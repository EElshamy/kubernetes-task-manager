
services:
  postgres:
    image: postgres:16-alpine
    container_name: task-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: task_manager_user
      POSTGRES_PASSWORD: task_manager_dev_password
      POSTGRES_DB: task_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager_user -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: eslamelshamy/kubernetes-task-manager:3.0.0
    command:
      - node
      - ./node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/database/data-source.js
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: task_manager_user
      DATABASE_PASSWORD: task_manager_dev_password
      DATABASE_NAME: task_manager
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: eslamelshamy/kubernetes-task-manager:3.0.0
    container_name: task-manager-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: task_manager_user
      DATABASE_PASSWORD: task_manager_dev_password
      DATABASE_NAME: task_manager
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: eslamelshamy/kubernetes-task-manager-frontend:v2.0.0
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

